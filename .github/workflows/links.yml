name: Link Checker

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --config lychee.toml 'README.md' './docs/**/*.qmd' './docs/**/*.md'
          fail: true
